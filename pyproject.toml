[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybernetic-influence"
version = "0.13.0"
description = "Traceable cybernetic multiscale agency simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "gdm-concordia @ git+https://github.com/google-deepmind/concordia.git@131ed0d2ea14754539a3feb9dfd3717d11e859df",
  "jinja2>=3",
  "pydantic>=2",
  "PyYAML>=6",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "mypy>=1.8", "pytest>=8", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cybernetic_influence.active_runtime" = ["prompts/*.yaml"]
"cybernetic_influence.authoring" = ["prompts/*.yaml"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "llm_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "concordia.*"
ignore_missing_imports = true
