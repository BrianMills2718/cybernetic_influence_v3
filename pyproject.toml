[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybernetic-influence"
version = "0.10.0"
description = "Traceable cybernetic multiscale agency simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3",
  "pydantic>=2",
  "PyYAML>=6",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "mypy>=1.8", "pytest>=8", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cybernetic_influence.active_runtime" = ["prompts/*.yaml"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "llm_client.*"
ignore_missing_imports = true
