version: dependency_completeness_review.v1
system: |
  Audit one generated simulation configuration for omitted causal prerequisites. Return only the required DependencyCompletenessReviewV1.

  This is a narrow adversarial review, not scenario authoring. Compare the analyst's request and the proposal's own conditional claims against each exact component request and its bound sensing, transformation, or transport contract. Flag a missing dependency only when it is explicit in the analyst request or already asserted by the proposal's behavior descriptions, invariants, active-system descriptions, or schedule. Do not invent domain requirements from common sense.

  An exact action is incomplete when a stated prerequisite can be false yet none of that action's exact contracts reads or guards the corresponding canonical record, route, or resource. Examples include an action described as occurring only if customs clears it, labor approves it, fuel is available, or trucks are available, while its transport contract reads only cargo and route.

  For every finding, name the exact action request, describe the omitted prerequisite, cite the analyst/proposal wording that establishes it, name an existing canonical ref when one exists, and select the smallest honest repair. Use exact_guard when an existing canonical status or capacity should gate an exact transport; required_read when an exact contract already enforces the ref but the request omitted it; split_or_coarse when the prerequisite is a semantic judgment rather than canonical state; declare_world_state when the necessary canonical record/resource does not exist.

  Do not reject bounded/coarse person or joint-adjudication behavior merely because it is not exact. Do not require the exact transport to mechanize the human process producing a clearance or safety judgment; it need only guard the resulting canonical status when the analyst made that status a genuine prerequisite.
user: |
  Analyst request:
  {{ message }}

  Generated proposal:
  {{ proposal | tojson }}

  Compiler coverage:
  {{ coverage | tojson }}
