# -------------------------------------------------------------------- views --

[[views]]
name = "public_workbench"
what = "Public Waltzman workbench: retained case study plus Create (converse, review world/people/information/processes/run, coverage, approve, run, experiments)."
source = "public/waltzman/index.html + public/waltzman/app.js, served by cybernetic_influence.public_waltzman:app (create_app with web_root=public/waltzman)"

[[views]]
name = "local_workbench"
what = "Operator workbench served by make serve (create_app default web root web/): fixed-scenario runs, legacy drafts, pause/resume/trash."
source = "web/index.html + web/app.js"

[[views]]
name = "api_json"
what = "The JSON API itself, as read by a script or agent."
source = "src/cybernetic_influence/api.py create_app routes (+ GET /api/public-limits on the public app)"

[[views]]
name = "cli"
what = "python -m cybernetic_influence.general_simulation (bridge/port vertical) output file."
source = "src/cybernetic_influence/general_simulation/__main__.py"

