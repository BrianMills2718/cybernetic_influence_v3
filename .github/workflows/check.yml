name: check

# The suite went red on 2026-08-26 and stayed red through three merges, because
# nothing ran `make check` between opening a pull request and merging it. This
# is that missing step.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # llm_client is a separately versioned private provider boundary, not a
      # pinned dependency in requirements-dev.lock. Without it the suite does
      # not merely skip -- it fails to collect, with 11 collection errors. The
      # read-only deploy key in LLM_CLIENT_DEPLOY_KEY is what makes CI able to
      # run the tests at all.
      - name: Check out llm_client
        uses: actions/checkout@v7
        with:
          repository: BrianMills2718/llm_client
          path: .llm_client
          ssh-key: ${{ secrets.LLM_CLIENT_DEPLOY_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: make install LLM_CLIENT_ROOT=.llm_client

      - run: make check LLM_CLIENT_ROOT=.llm_client

      # `make check` runs assets-check after ui-build, so it compares a bundle
      # it just produced against the source it produced it from and cannot fail.
      # The question that matters here is whether the bundle committed to web/
      # is the one frontend/src builds; only a diff after the build answers it.
      - name: The committed bundle matches frontend/src
        run: git diff --exit-code -- web/
