schema_version: ui-registry/v1
project_id: cybernetic_influence_v3
ui_status: active
surfaces:
  - id: operator-review-app
    lifecycle: canonical
    source_path: frontend/src
    purpose: >-
      Local operator/researcher app for configuring, running, and replaying
      simulations, and reviewing per-run evidence (review dossier,
      simulation trace).
    entrypoints:
      local: http://127.0.0.1:8620
    run_commands:
      build: make ui-build
      server: make serve
      focused_tests: make ui-smoke
    data_boundary:
      source: Live local simulation runs and their persisted artifacts.
      served: Vite-built static output committed to web/; frontend/src is
        the real source, web/ is generated -- edit frontend/src, not web/
        directly.
    provenance:
      - frontend/vite.config.ts (build.outDir points at ../web)
      - src/cybernetic_influence/api.py (mounts web/ at /, /review,
        /review/trace, /assets)
  - id: public-waltzman-demo
    lifecycle: canonical
    source_path: public/waltzman
    purpose: >-
      Public Waltzman outreach and simulation workbench: a first-screen
      local-information-to-collective-action hook, natural-language authoring,
      retained case/replay evidence, detachable analysis, and Experimentation.
    entrypoints:
      production: https://brian-mac-mini.tail9c321e.ts.net/waltzman/
    run_commands:
      deploy: scripts/deploy_public_waltzman.sh
      build_dataset: python scripts/build_public_waltzman_dataset.py
      capture: python scripts/capture_waltzman_demo.py
      verify: python scripts/verify_demo_ui.py
    data_boundary:
      deployment: Deployed to a separate host (Mac Mini) from the local
        operator app; deploy_public_waltzman.sh refuses to deploy over a
        dirty working tree or a run in flight on the host.
      audience: Public/external. Note that operator-review-app is also
        publicly reachable, at https://brianmills.dev/cybernetic-influence,
        proxied to 127.0.0.1:8620 by the Mac mini's public-prefix proxy -
        measured 2026-09-05. Its mutating endpoints return 403 "operator
        identity is not authorized" to anonymous callers, verified on
        /api/runs, /api/composite-assays and /api/authoring/drafts, so the
        exposure is the API surface at /docs and /openapi.json rather than any
        spend-bearing action. This entry previously described that app as
        local-only, which had stopped being true.
    provenance:
      - scripts/deploy_public_waltzman.sh
      - docs/ROADMAP.md (Slice 30 Artifact Disposition row)
    tours:
      engine: public/waltzman/tour.js
      steps: inline at the foot of public/waltzman/index.html
      screens: [waltzman]
      policy: spotlight-tour-default
